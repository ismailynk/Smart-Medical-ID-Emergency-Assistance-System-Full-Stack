<div class="flex h-screen">
    <div class="w-full lg:w-4 h-full text-center px-6 py-6 flex flex-column justify-content-between">
        <img [src]="'assets/layout/images/logo-dark.svg'" class="h-4rem mt-4" alt="diamond-layout"/>

        <div class="flex flex-column align-items-center gap-4">
            <div class="mb-3">
                <h2>Lütfen Giriş Yapın.</h2>

                <p>Üye Olmak İçin <a  class="text-primary hover:underline cursor-pointer font-medium" routerLink="/auth/register">Buraya </a> Tıklayınız</p>
            </div>
            <input #username pInputText id="email" placeholder="Tc Kimlik NO" class="w-20rem"/>
            <p-password #password id="password" placeholder="Şifre" [feedback]="true"
                        inputStyleClass="w-20rem"></p-password>
            <button pButton label="Giriş" type="button" class="w-20rem"
                    (click)="login(username.value, password.value)"></button>
        </div>

        <p class="text-color-secondary font-semibold">Daha Rahat Bir Hayat Seviyesi için Tam Zamanı.</p>
    </div>
    <div
        class="w-8 hidden lg:flex flex-column justify-content-between align-items-center px-6 py-6 bg-cover bg-norepeat"
        style="background-image: url('../../../../assets/demo/images/auth/bg-login.jpg')">
        <div class=" text-black-alpha-90 mt-auto mb-auto">
            <span class="block  text-7xl font-semibold">Her <br/>Birey <br/>Özeldir</span>
            <span class="block  text-3xl mt-4 font-semibold" >Kayıt ol, kendi sayfanı oluştur <br/> hastalığını tanımla ve özelleştir <br/> korkusuz bir hayata merhaba de. </span>
        </div>
        <div class="flex align-items-center gap-5">
            <span class="text-white font-semibold">Bir GROUPJAVA projesidir.</span>
            <!---<i class="pi pi-github text-3xl p-1 surface-overlay border-circle cursor-pointer"></i>
            <i class="pi pi-twitter text-3xl p-1 surface-overlay border-circle cursor-pointer"></i>--->
        </div>
    </div>
</div>
<app-config [minimal]="true"></app-config>
