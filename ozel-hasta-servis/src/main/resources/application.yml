server:
  error:
    include-stacktrace: never
  servlet:
    context-path: /ozel-hasta
spring:
  liquibase:
    change-log: classpath:liquibase/master.xml
  datasource:
    url: jdbc:h2:file:./data/firatdb
    username: sa
    password: 12345
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
